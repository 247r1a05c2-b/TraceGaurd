name: Client Management Upgrade

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/client-management.yml'

permissions:
  contents: write

jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch backend and frontend
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          monitoring = Path('backend/app/monitoring.py')
          text = monitoring.read_text()
          marker = '\ndef record_audit('
          if 'def remove_client(' not in text:
              fn = '''\n\ndef remove_client(client_id: str) -> dict:\n    if client_id not in clients:\n        raise KeyError(client_id)\n    client = clients.pop(client_id)\n    return client\n'''
              text = text.replace(marker, fn + marker, 1)
              monitoring.write_text(text)

          main = Path('backend/app/main.py')
          text = main.read_text()
          old_import = 'from .monitoring import audit_log, clients, execute_approved_action, execution_log, heartbeat, check_website, hydrate_clients, record_audit, register_client'
          new_import = 'from .monitoring import audit_log, clients, execute_approved_action, execution_log, heartbeat, check_website, hydrate_clients, record_audit, register_client, remove_client'
          text = text.replace(old_import, new_import, 1)
          endpoint = '''\n\n@app.delete("/api/v1/clients/{client_id}")\ndef delete_client(client_id: str, engineer: str = Depends(current_engineer)):\n    try:\n        client = remove_client(client_id)\n    except KeyError as exc:\n        raise HTTPException(status_code=404, detail="Client not found") from exc\n    with SessionLocal() as session:\n        record = session.get(ClientRecord, client_id)\n        if record is not None:\n            session.delete(record)\n            session.commit()\n    record_audit("CLIENT_REMOVED", engineer, {"client_id": client_id, "name": client.get("name")})\n    return {"removed": True, "client_id": client_id, "name": client.get("name"), "message": "Client removed from active monitoring. Historical incidents are preserved."}\n'''
          if '@app.delete("/api/v1/clients/{client_id}")' not in text:
              anchor = '\n\n@app.post("/api/v1/clients/{client_id}/heartbeat")'
              text = text.replace(anchor, endpoint + anchor, 1)
          main.write_text(text)

          ui = Path('frontend/src/main.tsx')
          text = ui.read_text()
          old_view = "{view==='Clients'&&<Clients clients={clients} token={token!} onChanged={load} onIncident={analyze}/>}"
          new_view = "{view==='Clients'&&<ClientManagement clients={clients} token={token!} onChanged={load} onIncident={analyze}/> }"
          if old_view in text:
              text = text.replace(old_view, new_view, 1)

          component = r'''\n\nfunction ClientManagement({clients,token,onChanged,onIncident}:{clients:Client[];token:string;onChanged:()=>Promise<void>;onIncident:(id:string)=>void}){\n const [form,setForm]=useState({name:'',environment:'production',service:'web',website_url:'',health_path:'/'});\n const [checking,setChecking]=useState<string|null>(null);\n const [removing,setRemoving]=useState<Client|null>(null);\n const [saving,setSaving]=useState(false);\n const [msg,setMsg]=useState('');\n const [error,setError]=useState('');\n const add=async(e:React.FormEvent)=>{e.preventDefault();setSaving(true);setMsg('');setError('');try{await api('/api/v1/clients',{method:'POST',body:JSON.stringify(form)},token);setForm({name:'',environment:'production',service:'web',website_url:'',health_path:'/'});await onChanged();setMsg('Client registered and monitoring is ready.')}catch(x){setError((x as Error).message)}finally{setSaving(false)}};\n const check=async(id:string)=>{setChecking(id);setMsg('');setError('');try{const r=await api<any>(`/api/v1/clients/${id}/check`,{method:'POST'},token);await onChanged();if(r.incident_id)onIncident(r.incident_id);else setMsg(`Health check passed · ${r.http_status} · ${r.response_ms} ms`)}catch(x){setError((x as Error).message)}finally{setChecking(null)}};\n const remove=async()=>{if(!removing)return;setSaving(true);setError('');try{await api(`/api/v1/clients/${removing.client_id}`,{method:'DELETE'},token);setRemoving(null);await onChanged();setMsg('Client removed from active monitoring. Historical incidents remain preserved.')}catch(x){setError((x as Error).message)}finally{setSaving(false)}};\n return <div className="page client-management">\n  <div className="section-intro client-heading"><div><span className="pill">CLIENT OPERATIONS</span><h2>Client Command Center</h2><p>Onboard, monitor, pause and remove customer services without touching the incident investigation pipeline.</p></div><span className="client-count">{clients.length} ACTIVE CLIENT{clients.length===1?'':'S'}</span></div>\n  {(msg||error)&&<div className={error?'error banner':'notice'}>{error||msg}</div>}\n  <div className="client-management-grid">\n   <section className="register-card"><div className="register-icon">＋</div><span className="pill">NEW CUSTOMER</span><h3>Register a monitored client</h3><p>Connect a website or service to TraceGaurd monitoring. A failed health check can automatically create an incident for RCA.</p><form onSubmit={add} className="client-form"><label>Client / organization<input required value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="Acme Commerce"/></label><div className="form-two"><label>Environment<select value={form.environment} onChange={e=>setForm({...form,environment:e.target.value})}><option>production</option><option>staging</option><option>development</option></select></label><label>Service<input required value={form.service} onChange={e=>setForm({...form,service:e.target.value})} placeholder="checkout-api"/></label></div><label>Website / health endpoint<input required value={form.website_url} onChange={e=>setForm({...form,website_url:e.target.value})} placeholder="https://example.com"/></label><label>Health path<input value={form.health_path} onChange={e=>setForm({...form,health_path:e.target.value})} placeholder="/health"/></label><div className="monitor-preview"><b>Monitoring preview</b><span>{form.website_url||'https://your-client.com'}{form.health_path||'/'}</span><small>Availability · HTTP errors · response latency · incident creation</small></div><button className="primary wide" disabled={saving}>{saving?'Saving…':'Register Client →'}</button></form></section>\n   <section className="inventory-card"><div className="inventory-head"><div><span className="pill">ACTIVE SERVICES</span><h3>Monitored clients</h3></div><span className="live"><i/> LIVE</span></div><div className="inventory-list">{clients.map(c=><article className="inventory-item" key={c.client_id}><div className="inventory-main"><div className="service-icon">⌁</div><div><h4>{c.name}</h4><p>{c.service} · {c.environment}</p><small>{c.website_url?`${c.website_url}${c.health_path||'/'}`:'Telemetry-only client'}</small></div></div><div className="inventory-status"><span className={c.status==='DOWN'?'online-badge down-text':'online-badge'}><i/> {c.status}</span><strong>{c.last_response_ms?`${c.last_response_ms} ms`:'—'}</strong></div><div className="inventory-actions"><button className="ghost small" disabled={!c.website_url||checking===c.client_id} onClick={()=>check(c.client_id)}>{checking===c.client_id?'Checking…':'Check now'}</button><button className="danger small" onClick={()=>setRemoving(c)}>Remove Client</button></div></article>)}{!clients.length&&<Empty text="No clients registered. Use the onboarding panel to add your first monitored service."/>}</div></section>\n  </div>\n  {removing&&<div className="confirm-backdrop"><div className="confirm-card"><div className="danger-icon">!</div><span className="pill">REMOVE CLIENT</span><h3>Remove {removing.name}?</h3><p>This stops active monitoring for <b>{removing.service}</b>. Existing incident history is preserved.</p><div className="confirm-actions"><button className="ghost" onClick={()=>setRemoving(null)}>Cancel</button><button className="danger" disabled={saving} onClick={remove}>{saving?'Removing…':'Remove Client'}</button></div></div></div>}\n </div>\n}\n'''
          if 'function ClientManagement(' not in text:
              text += component
          ui.write_text(text)
          PY

      - name: Add client-management styles
        run: |
          cat >> frontend/src/style.css <<'CSS'

.client-management-grid{display:grid;grid-template-columns:minmax(340px,.8fr) minmax(520px,1.2fr);gap:22px;align-items:start}
.register-card,.inventory-card{border:1px solid var(--border);background:var(--card);border-radius:24px;padding:28px;box-shadow:var(--shadow,0 14px 40px rgba(0,0,0,.08))}
.register-card{position:relative;overflow:hidden}.register-card:before{content:'';position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#7c3aed,#06b6d4);opacity:.9}.register-icon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:25px;background:rgba(124,58,237,.12);margin-bottom:18px}.register-card h3,.inventory-card h3{font-size:24px;margin:10px 0 8px}.register-card>p{color:var(--muted);line-height:1.6;margin-bottom:22px}.inventory-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px}.inventory-list{display:grid;gap:12px}.inventory-item{border:1px solid var(--border);border-radius:18px;padding:17px;background:var(--surface);display:grid;grid-template-columns:1fr auto;gap:14px}.inventory-main{display:flex;gap:13px;min-width:0}.inventory-main h4{margin:1px 0 5px;font-size:16px}.inventory-main p,.inventory-main small{display:block;color:var(--muted);margin:0}.inventory-main small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:430px;margin-top:5px}.inventory-status{display:flex;gap:15px;align-items:center}.inventory-status strong{font-size:13px}.inventory-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;border-top:1px solid var(--border);padding-top:12px}.client-count{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--muted)}.danger{border:1px solid rgba(239,68,68,.35);background:rgba(239,68,68,.1);color:#ef4444;border-radius:10px;padding:10px 14px;font-weight:750;cursor:pointer}.danger:hover{background:rgba(239,68,68,.17)}.confirm-backdrop{position:fixed;inset:0;z-index:100;background:rgba(2,6,23,.65);backdrop-filter:blur(8px);display:grid;place-items:center;padding:20px}.confirm-card{width:min(440px,100%);border:1px solid var(--border);background:var(--card);border-radius:24px;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.3)}.danger-icon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(239,68,68,.12);color:#ef4444;font-weight:900;font-size:20px;margin-bottom:16px}.confirm-card h3{font-size:25px;margin:12px 0}.confirm-card p{color:var(--muted);line-height:1.6}.confirm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.small{padding:9px 12px!important;font-size:12px!important}@media(max-width:1050px){.client-management-grid{grid-template-columns:1fr}.inventory-item{grid-template-columns:1fr}.inventory-status{justify-content:flex-start}.inventory-actions{justify-content:flex-start}}
CSS

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/app/main.py backend/app/monitoring.py frontend/src/main.tsx frontend/src/style.css
          git diff --cached --quiet || git commit -m "Add client onboarding and remove workflow"
          git push
