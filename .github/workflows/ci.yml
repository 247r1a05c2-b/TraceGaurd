name: TraceGaurd CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DEMO_ENGINEER_EMAIL: engineer@tracegaurd.ai
  DEMO_ENGINEER_PASSWORD: ci-test-password
  TRACEGAURD_SECRET: ci-session-secret-for-tests-only
  TRACEGAURD_CLIENT_INGEST_SECRET: ci-client-secret-for-tests-only

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt pytest
      - run: pytest backend/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build
