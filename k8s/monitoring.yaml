apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: tracegaurd
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    scrape_configs:
      - job_name: tracegaurd-api
        metrics_path: /metrics
        static_configs:
          - targets: ['tracegaurd-api:8000']
  alerts.yml: |
    groups:
      - name: tracegaurd
        rules:
          - alert: TraceGaurdHighErrorRate
            expr: sum(rate(tracegaurd_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(tracegaurd_http_requests_total[5m])),1) > 0.05
            for: 5m
            labels:
              severity: critical
          - alert: TraceGaurdHighLatency
            expr: histogram_quantile(0.95, sum(rate(tracegaurd_http_request_duration_seconds_bucket[5m])) by (le)) > 1.5
            for: 10m
            labels:
              severity: warning
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: tracegaurd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.5.0
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.retention.time=15d
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: tracegaurd
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tracegaurd
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:12.2.0
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: admin
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tracegaurd-grafana
                  key: password
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Secret
metadata:
  name: tracegaurd-grafana
  namespace: tracegaurd
stringData:
  password: change-me
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: tracegaurd
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
