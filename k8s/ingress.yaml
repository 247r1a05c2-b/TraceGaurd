apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tracegaurd
  namespace: tracegaurd
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "2m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.tracegaurd.example.com
      secretName: tracegaurd-tls
  rules:
    - host: api.tracegaurd.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tracegaurd-api
                port:
                  number: 8000
