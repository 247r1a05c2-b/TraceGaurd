services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://tracegaurd:tracegaurd@postgres:5432/tracegaurd
    depends_on:
      - postgres
  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: tracegaurd
      POSTGRES_PASSWORD: tracegaurd
      POSTGRES_DB: tracegaurd
    ports:
      - "5432:5432"
    volumes:
      - tracegaurd_pgdata:/var/lib/postgresql/data
volumes:
  tracegaurd_pgdata:
